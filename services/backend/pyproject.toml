[project]
name = "zoujin-backend"
version = "0.0.0"
description = "Gateway, narrator and mock services (one package, deployed as two Cloud Run services; B-0 and B-1 add to it) / ゲートウェイ、ナレーター、mock サービス（1 パッケージで 2 つの Cloud Run サービスとしてデプロイ。B-0・B-1 で追加していく）"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "psycopg[binary]>=3.2",
    "referencing>=0.36",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.38",
    "websockets>=15",
    "zoujin-contracts",
    "zoujin-llm",
    "zoujin-worldsim",
]

[project.scripts]
zoujin-mock = "zoujin_backend.mock.cli:main"
zoujin-gateway = "zoujin_backend.gateway.app:main"
zoujin-narrator = "zoujin_backend.narrator.app:main"
zoujin-admin = "zoujin_backend.admin:main"
zoujin-s2 = "zoujin_backend.s2:main"
zoujin-probe = "zoujin_backend.probe:main"
zoujin-s5 = "zoujin_backend.s5:main"
zoujin-voice = "zoujin_backend.voice.cli:main"
zoujin-safety = "zoujin_backend.safety_eval:main"
zoujin-live = "zoujin_backend.live_cli:main"

[project.optional-dependencies]
real = [
    "google-auth[requests]>=2.40",
    "zoujin-llm[real]",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
zoujin-contracts = { workspace = true }
zoujin-llm = { workspace = true }
zoujin-worldsim = { workspace = true }

[dependency-groups]
dev = [
    "types-jsonschema>=4.25",
]
