[project]
name = "zoujin-backend"
version = "0.0.0"
description = "网关、叙事者和 mock 服务（一个包，部署成两个 Cloud Run 服务；B-0、B-1 往里写）"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "psycopg[binary]>=3.2",
    "referencing>=0.36",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.38",
    "websockets>=15",
    "zoujin-contracts",
    "zoujin-worldsim",
]

[project.scripts]
zoujin-mock = "zoujin_backend.mock.cli:main"
zoujin-gateway = "zoujin_backend.gateway.app:main"
zoujin-narrator = "zoujin_backend.narrator.app:main"
zoujin-admin = "zoujin_backend.admin:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
zoujin-contracts = { workspace = true }
zoujin-worldsim = { workspace = true }

[dependency-groups]
dev = [
    "types-jsonschema>=4.25",
]
