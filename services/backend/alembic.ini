# 迁移（B-0）：在仓库根目录跑
#   DATABASE_URL=postgresql://… uv run alembic -c services/backend/alembic.ini upgrade head
# 连接串只从环境变量 DATABASE_URL 读，不写在这里。
[alembic]
script_location = %(here)s/src/zoujin_backend/db/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
