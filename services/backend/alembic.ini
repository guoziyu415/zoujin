# Migrations (B-0): run from the repo root
# マイグレーション（B-0）：リポジトリのルートで実行する
#   DATABASE_URL=postgresql://… uv run alembic -c services/backend/alembic.ini upgrade head
# The connection string is read only from the DATABASE_URL environment variable, never written here.
# 接続文字列は環境変数 DATABASE_URL からのみ読み、ここには書かない。
[alembic]
script_location = %(here)s/src/zoujin_backend/db/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
