[project]
name = "zoujin-contracts"
version = "0.0.0"
description = "Contracts shared by frontend, backend and data: pydantic models generated from schemas/ (C-1, C-2) / フロントエンド、バックエンド、データで共有する契約：schemas/ から生成した pydantic モデル（C-1、C-2）"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12",
]

[project.scripts]
contracts-gen = "zoujin_contracts.codegen:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# For the contract tests (C-2): validation per JSON Schema 2020-12; referencing is a dependency of jsonschema itself,
# used directly to resolve relative $refs.
# 契約テスト用（C-2）：JSON Schema 2020-12 で検証する。referencing は jsonschema 自身の依存で、相対 $ref の解決に直接使う。
# datamodel-code-generator: `uv run contracts-gen` generates the pydantic models (C-1).
# datamodel-code-generator：`uv run contracts-gen` で pydantic モデルを生成する（C-1）。
[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "jsonschema>=4.25",
    "referencing>=0.36",
]
