# The model-calling parts shared by the narrator (backend) and the judge (evals) (B-8): the ledger, Claude's prices and
# tier names, replay keys, and the Anthropic connection. The backend and evals do not depend on each other; both depend
# on this package.
# ナレーター（バックエンド）と審査員（evals）が共用するモデル呼び出し部分（B-8）：台帳、Claude の単価とティア名、
# リプレイのキー、Anthropic への接続。バックエンドと evals は互いに依存せず、どちらもこのパッケージに依存する。
[project]
name = "zoujin-llm"
version = "0.0.0"
description = "Shared ledger, Claude prices, replay keys and Anthropic client (B-8) / 共用の台帳、Claude の単価、リプレイのキー、Anthropic クライアント（B-8）"
requires-python = ">=3.13,<3.14"
dependencies = []

# real: the Anthropic SDK (real calls only on zg's Mac; CI installs it only for type checking and offline unit tests)
# real：Anthropic の SDK（実際の呼び出しは zg の Mac 上だけ。CI では型検査とネットワークなしの単体テストのためだけに入れる）
[project.optional-dependencies]
real = ["anthropic>=1,<2"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
