# 评测（数据负责）：evals/ 下的生成器和自检脚本是只用标准库的独立脚本，不打包；
# src/zoujin_evals 是评测运行器（E-0），推演规则从 W-1 的包 zoujin_worldsim 来。
[project]
name = "zoujin-evals"
version = "0.0.0"
description = "评测运行器（E-0）：读 E1〜E8 的用例，经后端的 eval_api 跑，做确定性检查，出报告"
requires-python = ">=3.13,<3.14"
dependencies = ["zoujin-llm", "zoujin-worldsim"]

[project.scripts]
zoujin-eval = "zoujin_evals.cli:main"
zoujin-judge = "zoujin_evals.calibrate:main"

# real：评审员的真客户端（只在 zg 的 Mac 上调；CI 装上只为类型检查和导入）
[project.optional-dependencies]
real = ["zoujin-llm[real]"]

[tool.uv.sources]
zoujin-llm = { workspace = true }
zoujin-worldsim = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
