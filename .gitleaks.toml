# gitleaks rules (R-0): default rules plus this project's own.
# Addresses, project IDs, billing IDs, keys, test codes and invite codes must not enter the repo (deployment rules in the README).
# gitleaks ルール（R-0）：デフォルトルール＋このプロジェクト独自のもの。
# アドレス、プロジェクト ID、請求 ID、鍵、テストコード、招待コードはリポジトリに入れない（README のデプロイ規約）。
title = "zoujin"

[extend]
useDefault = true

[[rules]]
id = "zoujin-invite-code"
description = "Invite code (format from B-0 item 3) / 招待コード（B-0 第 3 項の形式）"
regex = '''(?i)\binv-[0-9a-hjkmnp-tv-z]{4}(?:-[0-9a-hjkmnp-tv-z]{4}){3}\b'''
keywords = ["inv-"]

  [[rules.allowlists]]
  description = "Placeholder form used in docs / ドキュメント内のプレースホルダー表記"
  regexes = ['''(?i)^inv-xxxx-xxxx-xxxx-xxxx$''']

[[rules]]
id = "zoujin-run-app-url"
description = "Cloud Run address: random string plus .a.run plus .app, and service-name-project-number.region plus .run.app / Cloud Run のアドレス：ランダム文字列＋.a.run＋.app、およびサービス名-プロジェクト番号.リージョン＋.run.app"
regex = '''(?i)\b[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9-]+)*\.run\.app\b'''
keywords = ["run.app"]

[[rules]]
id = "zoujin-billing-account-id"
description = "GCP billing account ID (three groups of 6 hex digits joined by hyphens) / GCP 請求アカウント ID（6 桁の 16 進数 3 組をハイフンで連結）"
regex = '''(?i)\b[0-9a-f]{6}-[0-9a-f]{6}-[0-9a-f]{6}\b'''

[[rules]]
id = "zoujin-service-account-email"
description = "GCP service account email / GCP サービスアカウントのメールアドレス"
regex = '''(?i)\b[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com\b'''
keywords = ["iam.gserviceaccount.com"]

  [[rules.allowlists]]
  description = "Fake address in backend offline tests (spikes/backend/tests/test_s1b.py) / バックエンドのオフラインテスト内の偽アドレス（spikes/backend/tests/test_s1b.py）"
  regexes = ['''(?i)@offline-test\.iam\.gserviceaccount\.com$''']

[[rules]]
id = "zoujin-macos-home-path"
description = "macOS home directory path (/Users/ plus username): usernames and paths from a Mac must not enter the repo; logs and results brought back from a Mac are the most likely to carry them / macOS ホームディレクトリのパス（/Users/＋ユーザー名）：Mac のユーザー名とパスはリポジトリに入れない。Mac から持ち帰ったログや結果に最も混入しやすい"
regex = '''/Users/[A-Za-z0-9._-]+'''
keywords = ["/users/"]

  [[rules.allowlists]]
  description = "Placeholder forms used in docs and the system shared directory / ドキュメント内のプレースホルダー表記とシステム共有ディレクトリ"
  regexes = ['''(?i)^/Users/(?:shared|you|your-name|username|user|name|example)$''']
