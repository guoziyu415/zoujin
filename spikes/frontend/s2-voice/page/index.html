<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>音声テスト</title>
<style>
:root{--bg:#f1e9d8;--ink:#27221d;--mut:#6d655b;--line:#d8ccb4;--acc:#3f6f6c;--hot:#b93a26;--card:#fbf6ec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a17;--ink:#ece4d6;--mut:#a59b8c;--line:#3a342d;--acc:#7fb0ab;--hot:#e0745f;--card:#26221e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Hiragino Sans","PingFang SC",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:18px;margin:4px 0 12px}
h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row label{font-size:13px;color:var(--mut)}
select,input[type=text],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5}
.hidden{display:none!important}
.mut{color:var(--mut);font-size:13px}
#talk{width:100%;height:120px;border-radius:60px;font-size:20px;font-weight:600;margin:10px 0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--acc);border-color:var(--acc);color:#fff}
#talk.on{background:var(--hot);border-color:var(--hot)}
#state{font-size:13px;color:var(--mut);min-height:20px}
#lines{max-height:240px;overflow:auto;font-size:14px}
#lines p{margin:4px 0}
#lines .me{color:var(--mut)}
#lines .partial{opacity:.6}
#say{font-size:18px;font-weight:600;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums}
#meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#meter div{height:100%;width:0;background:var(--acc)}
.env td:first-child{color:var(--mut);width:42%}
textarea{width:100%;height:90px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>音声テスト</h1>

  <section id="login" class="card hidden">
    <p>テストコードを入れてください。</p>
    <div class="row"><input id="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="コード"><button id="loginBtn" class="primary">入る</button></div>
    <p id="loginMsg" class="mut"></p>
  </section>

  <section id="setup" class="card hidden">
    <p style="margin:0 0 8px;font-weight:600">メロスと話す</p>
    <div class="row">
      <label>测试项 <select id="item">
        <option value="t1">1 松手到出声</option>
        <option value="t2">2 打断</option>
        <option value="t3">3 蓝牙耳机麦克风两种做法</option>
        <option value="t4">4 静音键开着</option>
        <option value="t5">5 小声说话</option>
        <option value="t6">6 LINE 内置浏览器</option>
        <option value="t7">7 切后台再回来</option>
        <option value="t8">8 Wi-Fi 对照</option>
      </select></label>
    </div>
    <div class="row" style="margin-top:6px">
      <label>出声 <select id="route"><option value="" selected disabled>选一下</option><option value="speaker">外放</option><option value="bluetooth">蓝牙耳机</option><option value="wired">有线耳机</option></select></label>
      <label>网络 <select id="network"><option value="" selected disabled>选一下</option><option value="4g">4G</option><option value="wifi">Wi-Fi</option></select></label>
      <label>麦克风 <select id="mode"><option value="" selected disabled>选一下</option><option value="open">对话中常开</option><option value="perturn">每轮开关</option></select></label>
    </div>
    <p id="hint" class="mut"></p>
    <div class="row"><button id="connectBtn" class="primary">开始和メロス说话</button><button id="hangBtn" class="hidden">结束对话</button></div>
  </section>

  <section id="convo" class="card hidden">
    <div id="sayBox" class="hidden"><div class="mut">请用平时睡前的小音量读：</div><div id="say"></div><div class="row"><button id="prevSay">上一句</button><button id="nextSay">下一句</button><span id="sayIdx" class="mut"></span></div></div>
    <button id="talk">押して話す</button>
    <div id="meter"><div></div></div>
    <div id="state"></div>
    <div class="row" style="margin-top:8px"><input id="textIn" type="text" placeholder="文字で話す" style="flex:1"><button id="sendText">送る</button></div>
    <div id="lines" style="margin-top:8px"></div>
    <div id="resumeBox" class="hidden" style="margin-top:8px"><button id="resumeBtn" class="primary">タップで音を戻す</button></div>
  </section>

  <section id="results" class="card hidden">
    <h2 style="margin-top:0">结果</h2>
    <div id="summary" class="mut"></div>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>项</th><th>条件</th><th>松手→出声</th><th>服务端</th><th>其余</th></tr></thead><tbody id="turns"></tbody></table></div>
    <div class="row" style="margin-top:8px"><button id="copyBtn">复制全部结果</button><button id="clearBtn">清空</button></div>
    <textarea id="dump" class="hidden" readonly></textarea>
  </section>

  <section id="device" class="card hidden">
    <h2 style="margin-top:0">这台设备</h2>
    <table class="env"><tbody id="envT"></tbody></table>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
