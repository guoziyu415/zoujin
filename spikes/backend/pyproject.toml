[project]
name = "zj-spike"
version = "0.1.0"
description = "走进物语 后端技术验证脚本（只调用模型类服务；Model Armor 模板会自动删除；S-1b 的临时服务只在 zg 同意后由 s1b_deploy.sh 创建并删除）"
requires-python = ">=3.13,<3.14"
dependencies = [
  "google-genai==2.28.0",
  "google-cloud-modelarmor==0.7.2",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  # S-068 重测的两种判定走 Claude（D-028、S-086）：账本、单价、Anthropic 的连接用仓库里的共用包
  "zoujin-llm[real]",
  "anthropic==1.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
zoujin-llm = { path = "../../packages/llm", editable = true }
