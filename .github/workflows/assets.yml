# Scene assets (F-2; the river on the way back, F-10, works the same way): check the committed manifest (budgets, both color
# tiers, anchor points and layout, world model), then build the plaza from scratch with the draft tier in a clean environment
# to prove "one command does it all"; the committed manifest must come from the same inputs as this build; build again in
# another directory and the two manifests must be byte-identical (reproducible).
# シーンアセット（F-2。帰り道の川 F-10 も同じやり方）：リポジトリにあるマニフェスト（予算、2 段階の色、位置ポイントとレイアウト、
# 世界モデル）を確認し、クリーンな環境でドラフト品質で広場を一から生成して「コマンド 1 つで通る」ことを示す。リポジトリの
# マニフェストは今回と同じ入力から作られていなければならない。別のディレクトリでもう一度生成し、2 つのマニフェストがバイト単位で
# 一致する（再現できる）ことを確認する。
# Lightmaps at the final tier take about half an hour, so they are not baked in CI.
# 本番品質のライトマップは約 30 分かかるので、CI では焼かない。
# The village (F-11) works the same way, and also checks the shared roadside pack files it uses.
# 村（F-11）も同様で、使用する共用の道端パックのファイルも確認する。
# The royal castle (F-14) works the same way, as one pack.
# 王城（F-14）も同様で、パックは 1 つ。
# The execution-ground crowd (F-4) works the same way: check the committed crowd pack manifest, build it from scratch twice
# (MPFB fetched on the spot at the pinned commit), byte-identical, and the manifest matches the committed one.
# 刑場の群衆（F-4）も同様：リポジトリの群衆パックのマニフェストを確認し、一から 2 回生成して（MPFB は固定したコミットをその場で取得）、
# バイト単位で一致し、マニフェストがリポジトリのものと同じであることを確認する。
name: assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/pipeline/plaza/**"
      - "assets/pipeline/road/**"
      - "assets/pipeline/common/**"
      - "assets/pipeline/village/**"
      - "assets/pipeline/castle/**"
      - "assets/pipeline/crowd/**"
      - "assets/scenes/**"
      - "assets/budgets.json"
      - "assets/pipeline/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/assets.yml"
  push:
    branches: [main]
    paths:
      - "assets/pipeline/plaza/**"
      - "assets/pipeline/road/**"
      - "assets/pipeline/common/**"
      - "assets/pipeline/village/**"
      - "assets/pipeline/castle/**"
      - "assets/pipeline/crowd/**"
      - "assets/scenes/**"
      - "assets/budgets.json"
      - "assets/pipeline/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/assets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaza:
    name: plaza manifest, draft build from scratch
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: committed manifest (budgets, two-tier colour, spots against layout.json)
        run: node assets/pipeline/plaza/check_scene.mjs assets/scenes/syracuse-square
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assets/pipeline/plaza/requirements.txt
      - name: Blender as a Python module (bpy) and the X11/GL libraries it links
        run: |
          # Already installed in the self-hosted runner image (infra/ci-runner), which has no sudo either
          # セルフホストランナー（infra/ci-runner）のイメージにはインストール済みで、sudo もない
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
      - name: build the plaza from scratch (draft lightmaps)
        id: build
        run: BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/plaza/build.sh draft "$RUNNER_TEMP/plaza"
      - name: committed manifest built from the same inputs (layout, scripts, tool versions)
        run: node assets/pipeline/plaza/check_scene.mjs "$RUNNER_TEMP/plaza" assets/scenes/syracuse-square/layout.json --manifest assets/scenes/syracuse-square/scene.json
      - name: build again in other directories; the two manifests must be byte-identical (README, reproducibility) / 別のディレクトリで再生成し、2 つのマニフェストはバイト単位で一致すること（README、再現性）
        # runs even when the manifest above is stale, so a red stale check still tells whether the build reproduces
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/plaza/build.sh draft "$RUNNER_TEMP/plaza2"
          cmp "$RUNNER_TEMP/plaza/scene.json" "$RUNNER_TEMP/plaza2/scene.json"

  road:
    name: road river manifests, draft build from scratch
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: committed manifests (both packs, road-common, the scene.road-river index and layout)
        run: |
          for p in road-river-calm road-river-flood; do node assets/pipeline/plaza/check_scene.mjs assets/scenes/$p; done
          node assets/pipeline/road/check_road.mjs assets/scenes/road-common assets/scenes/road-river-calm assets/scenes/road-river-flood assets/scenes/road-river
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assets/pipeline/plaza/requirements.txt
      - name: Blender as a Python module (bpy) and the X11/GL libraries it links
        run: |
          # Already installed in the self-hosted runner image (infra/ci-runner), which has no sudo either
          # セルフホストランナー（infra/ci-runner）のイメージにはインストール済みで、sudo もない
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
      - name: build both packs from scratch (draft lightmaps)
        id: build
        run: BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/road/build.sh draft "$RUNNER_TEMP/road"
      - name: committed manifests built from the same inputs
        run: |
          for p in road-river-calm road-river-flood; do
            node assets/pipeline/plaza/check_scene.mjs "$RUNNER_TEMP/road/$p" assets/scenes/$p/layout.json --manifest assets/scenes/$p/scene.json
          done
          # the index and the merged layout hold no baked numbers: the committed ones are the fresh ones
          cmp assets/scenes/road-river/index.json "$RUNNER_TEMP/road/road-river/index.json"
          cmp assets/scenes/road-river/scene.json "$RUNNER_TEMP/road/road-river/scene.json"
      - name: navigation unit tests on the fresh packs (card F-10; skipped in web.yml, which builds only the plaza)
        run: |
          test -f "$RUNNER_TEMP/road/road-river-calm/nav.json" && test -f "$RUNNER_TEMP/road/road-river-flood/nav.json"
          ZOUJIN_SCENE_ROOT="$RUNNER_TEMP/road" pnpm --filter @zoujin/web exec vitest run src/three/nav/navmesh.river.test.ts
      - name: build again in other directories; every manifest must be byte-identical
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/road/build.sh draft "$RUNNER_TEMP/road2"
          for f in road-river-calm/scene.json road-river-flood/scene.json road-common/pack.json road-river/scene.json road-river/index.json; do
            cmp "$RUNNER_TEMP/road/$f" "$RUNNER_TEMP/road2/$f"
          done

  road-rest:
    name: road pass, spring, field and run manifests, draft build from scratch
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: committed manifests (the packs, their share of road-common, the three scenes' index and layout)
        run: bash assets/pipeline/road/check_committed.sh
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assets/pipeline/plaza/requirements.txt
      - name: Blender as a Python module (bpy) and the X11/GL libraries it links
        run: |
          # Already installed in the self-hosted runner image (infra/ci-runner), which has no sudo either
          # セルフホストランナー（infra/ci-runner）のイメージにはインストール済みで、sudo もない
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
      - name: build the packs from scratch (draft lightmaps)
        id: build
        run: BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/road/build_rest.sh draft "$RUNNER_TEMP/road"
      - name: committed manifests built from the same inputs
        run: |
          for p in road-pass-day road-spring-day road-field-day road-run-r1 road-run-r2 road-run-r2s road-run-r3 road-run-night; do
            node assets/pipeline/plaza/check_scene.mjs "$RUNNER_TEMP/road/$p" assets/scenes/$p/layout.json --manifest assets/scenes/$p/scene.json
          done
          # the indexes and the merged layouts hold no baked numbers: the committed ones are the fresh ones
          for s in road-pass road-spring road-field; do
            cmp assets/scenes/$s/index.json "$RUNNER_TEMP/road/$s/index.json"
            cmp assets/scenes/$s/scene.json "$RUNNER_TEMP/road/$s/scene.json"
          done
      - name: build again in other directories; every manifest must be byte-identical
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/road/build_rest.sh draft "$RUNNER_TEMP/road2"
          cd "$RUNNER_TEMP/road"
          for f in road-common/pack.json road-*/scene.json road-*/index.json; do cmp "$f" "$RUNNER_TEMP/road2/$f"; done

  castle:
    name: castle manifest, draft build from scratch
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: committed manifest
        run: node assets/pipeline/plaza/check_scene.mjs assets/scenes/castle-throne
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assets/pipeline/plaza/requirements.txt
      - name: Blender as a Python module (bpy) and the X11/GL libraries it links
        run: |
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
      - name: build from scratch (draft lightmaps)
        id: build
        run: BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/castle/build.sh draft "$RUNNER_TEMP/castle"
      - name: committed manifest built from the same inputs
        run: node assets/pipeline/plaza/check_scene.mjs "$RUNNER_TEMP/castle/castle-throne" assets/scenes/castle-throne/layout.json --manifest assets/scenes/castle-throne/scene.json
      - name: build again in another directory; the manifest must be byte-identical
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/castle/build.sh draft "$RUNNER_TEMP/castle2"
          cmp "$RUNNER_TEMP/castle/castle-throne/scene.json" "$RUNNER_TEMP/castle2/castle-throne/scene.json"

  crowd:
    name: crowd pack, built from scratch twice
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job uses only Node's built-ins; setup-node otherwise infers pnpm
          # caching from packageManager and fails before the build (no pnpm here).
          package-manager-cache: false
      - name: committed manifest (budgets; built from the script in the repo)
        run: node assets/pipeline/crowd/check_crowd.mjs assets/scenes/syracuse-square
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assets/pipeline/plaza/requirements.txt
      - name: Blender as a Python module (bpy) and the X11/GL libraries it links
        run: |
          # Already installed in the self-hosted runner image (infra/ci-runner), which has no sudo either
          # セルフホストランナー（infra/ci-runner）のイメージにはインストール済みで、sudo もない
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
      - name: build the crowd from scratch (MPFB 2 at the pinned commit)
        id: build
        run: BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/crowd/build.sh "$RUNNER_TEMP/crowd"
      - name: committed manifest is this build's
        run: node assets/pipeline/crowd/check_crowd.mjs "$RUNNER_TEMP/crowd" --manifest assets/scenes/syracuse-square/crowd.json
      - name: build again in another directory; byte-identical
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/crowd/build.sh "$RUNNER_TEMP/crowd2"
          cmp "$RUNNER_TEMP/crowd/crowd.bin" "$RUNNER_TEMP/crowd2/crowd.bin"
          cmp "$RUNNER_TEMP/crowd/crowd.json" "$RUNNER_TEMP/crowd2/crowd.json"

  village:
    name: village manifest, draft build from scratch
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: committed manifest (budgets, spots and places, its share of road-common)
        run: |
          node assets/pipeline/plaza/check_scene.mjs assets/scenes/village
          node assets/pipeline/village/check_village.mjs assets/scenes/road-common assets/scenes/village
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assets/pipeline/plaza/requirements.txt
      - name: Blender as a Python module (bpy) and the X11/GL libraries it links
        run: |
          # Already installed in the self-hosted runner image (infra/ci-runner), which has no sudo either
          # セルフホストランナー（infra/ci-runner）のイメージにはインストール済みで、sudo もない
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
      - name: build the village from scratch (draft lightmaps)
        id: build
        run: BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/village/build.sh draft "$RUNNER_TEMP/village"
      - name: committed manifest built from the same inputs
        run: node assets/pipeline/plaza/check_scene.mjs "$RUNNER_TEMP/village/village" assets/scenes/village/layout.json --manifest assets/scenes/village/scene.json
      - name: navigation unit tests on the fresh pack (card F-11)
        run: |
          test -f "$RUNNER_TEMP/village/village/nav.json"
          ZOUJIN_SCENE_ROOT="$RUNNER_TEMP/village" pnpm --filter @zoujin/web exec vitest run src/three/nav/navmesh.village.test.ts
      - name: build again in another directory; every manifest must be byte-identical
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/village/build.sh draft "$RUNNER_TEMP/village2"
          for f in village/scene.json road-common/pack.json village-light-sunset/pack.json village-light-night/pack.json village-light-rain/pack.json; do
            cmp "$RUNNER_TEMP/village/$f" "$RUNNER_TEMP/village2/$f"
          done
