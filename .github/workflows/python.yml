# Python：格式、类型、单元测试（禁网），世界模型和评测集的校验（dev-plan 2.4）。
# 路径过滤要包含测试读的非 .py 输入：Schema 和例子（packages/）、回放夹具、迁移配置、两份契约文档。
name: python

on:
  pull_request:
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "worlds/**"
      - "evals/**"
      - "packages/**"
      - "services/**"
      - "fixtures/**"
      - "docs/backend/api-contract.md"
      - "docs/data/contracts.md"
      - ".github/workflows/python.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "worlds/**"
      - "evals/**"
      - "packages/**"
      - "services/**"
      - "fixtures/**"
      - "docs/backend/api-contract.md"
      - "docs/data/contracts.md"
      - ".github/workflows/python.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ruff, mypy, pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --extra real：真客户端的可选依赖（google-auth，B-2）只为类型检查和不联网的单元测试装，CI 从不调用真模型
      - run: uv sync --locked --all-packages --extra real
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  world:
    name: world model, 24 simulations, eval seeds, generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # 工具从 W-1 的包 zoujin_worldsim import，用 workspace 的环境跑（包只用标准库）
      - run: uv sync --locked --all-packages
      - run: PYTHON=.venv/bin/python bash .github/scripts/check_world.sh

  # 要真 PostgreSQL 的测试（`db` 标记，B-0）：单事务、注入失败、并发、重放、网关端到端、评测入口和 E-0 的快照。
  # lint-test 里没有 DATABASE_URL，这些测试跳过；这里只跑它们。
  db:
    name: tests against PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zoujin
          POSTGRES_PASSWORD: zoujin
          POSTGRES_DB: zoujin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoujin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pytest -m db
        env:
          DATABASE_URL: postgresql://zoujin:zoujin@127.0.0.1:5432/zoujin_test
