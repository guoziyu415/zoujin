# Python: formatting, types, unit tests (no network), world model and eval set checks (dev-plan 2.4).
# Python：フォーマット、型、ユニットテスト（ネットワーク禁止）、世界モデルと評価セットの検査（dev-plan 2.4）。
# Path filters must include the non-.py inputs the tests read: Schemas and examples (packages/), replay fixtures, migration config, the two contract docs.
# パスフィルタには、テストが読む .py 以外の入力を含める：Schema と例（packages/）、リプレイのフィクスチャ、マイグレーション設定、2 つの契約ドキュメント。
name: python

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "worlds/**"
      - "evals/**"
      - "packages/**"
      - "services/**"
      - "fixtures/**"
      - "docs/backend/api-contract.md"
      - "docs/data/contracts.md"
      - ".github/workflows/python.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "worlds/**"
      - "evals/**"
      - "packages/**"
      - "services/**"
      - "fixtures/**"
      - "docs/backend/api-contract.md"
      - "docs/data/contracts.md"
      - ".github/workflows/python.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ruff, mypy, pytest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --extra real: the real client's optional dependency (google-auth, B-2) is installed only for type checking and offline unit tests; CI never calls a real model
      # --extra real：本物のクライアントの任意依存（google-auth、B-2）は型チェックとネットワークなしのユニットテストのためだけに入れる。CI は本物のモデルを呼ばない
      - run: uv sync --locked --all-packages --extra real
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  world:
    name: world model, 24 simulations, eval seeds, generated files
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # The tools import from W-1's package zoujin_worldsim and run in the workspace environment (the package uses only the standard library)
      # ツールは W-1 のパッケージ zoujin_worldsim から import し、workspace の環境で実行する（パッケージは標準ライブラリのみ使用）
      - run: uv sync --locked --all-packages
      - run: PYTHON=.venv/bin/python bash .github/scripts/check_world.sh

  # Tests needing a real PostgreSQL (`db` marker, B-0): single transaction, injected failures, concurrency, retries,
  # gateway end-to-end, eval entry point and E-0 snapshots.
  # 本物の PostgreSQL が必要なテスト（`db` マーカー、B-0）：単一トランザクション、障害注入、並行性、再送、ゲートウェイのエンドツーエンド、
  # 評価のエントリポイントと E-0 のスナップショット。
  # lint-test has no DATABASE_URL, so these tests are skipped there; only they run here.
  # lint-test には DATABASE_URL がないのでこれらのテストはスキップされる。ここではそれらだけを実行する。
  # The database is a PostgreSQL 17 process started inside the job (start_postgres.sh), not a services: container: the
  # self-hosted runner (a Linux container on zg's Mac, infra/ci-runner) has no Docker and is not given Docker.
  # データベースはジョブ内で起動する PostgreSQL 17 プロセス（start_postgres.sh）で、services: コンテナは使わない：セルフホストランナー
  # （zg の Mac 上の Linux コンテナ、infra/ci-runner）には Docker がなく、Docker を与えることもしない。
  db:
    name: tests against PostgreSQL
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: PostgreSQL 17 in this job (own data dir, removed with the job)
        run: bash .github/scripts/start_postgres.sh
      - run: uv run pytest -m db
      - name: stop PostgreSQL
        if: ${{ always() }}
        run: bash .github/scripts/start_postgres.sh stop
