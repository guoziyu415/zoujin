# 网页前端（F-2b、F-0）：单元测试、打包体积预算、世界屏幕和外壳的 Playwright 验收（无头 Chromium + 软件渲染）。
# 场景生成物不进仓库，这里用草稿档生成广场（和 assets.yml 同一条命令），按流水线、布局和锁文件缓存；
# 外壳的验收对着 B-1 的 mock 跑（Playwright 自己起 `uv run --all-packages zoujin-mock`）。截图作为构件上传，给 UX 看。
name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "assets/pipeline/plaza/**"
      - "assets/pipeline/road/**"
      - "assets/pipeline/crowd/**"
      - "assets/pipeline/package.json"
      - "assets/scenes/**"
      - "assets/budgets.json"
      - "pnpm-lock.yaml"
      - "services/backend/src/zoujin_backend/mock/**"
      - "fixtures/sessions/**"
      - "fixtures/mock/**"
      - "packages/contracts/**"
      - "uv.lock"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "assets/pipeline/plaza/**"
      - "assets/pipeline/road/**"
      - "assets/pipeline/crowd/**"
      - "assets/pipeline/package.json"
      - "assets/scenes/**"
      - "assets/budgets.json"
      - "pnpm-lock.yaml"
      - "services/backend/src/zoujin_backend/mock/**"
      - "fixtures/sessions/**"
      - "fixtures/mock/**"
      - "packages/contracts/**"
      - "uv.lock"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world:
    name: unit tests, bundle budget, world screen e2e
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 45
    steps:
      # where the plaza gets built and the web app reads it (scene-dir.ts); the runner context isn't available in job env
      - run: echo "ZOUJIN_SCENE_ROOT=$RUNNER_TEMP/scenes" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: plaza draft build from the cache
        id: scene
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scenes/syracuse-square
          key: plaza-draft-${{ hashFiles('assets/pipeline/plaza/**', 'assets/scenes/syracuse-square/layout.json', 'assets/pipeline/package.json', 'pnpm-lock.yaml') }}
      - name: road river draft build from the cache (F-10, river.spec.ts)
        id: road
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/scenes/road-common
            ${{ runner.temp }}/scenes/road-river-calm
            ${{ runner.temp }}/scenes/road-river-flood
            ${{ runner.temp }}/scenes/road-river
          key: road-draft-${{ hashFiles('assets/pipeline/road/**', 'assets/pipeline/plaza/**', 'assets/scenes/road-river-calm/layout.json', 'assets/scenes/road-river-flood/layout.json', 'assets/pipeline/package.json', 'pnpm-lock.yaml') }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            assets/pipeline/plaza/requirements.txt
      # B-1's mock for the app shell e2e (Playwright starts it)
      - run: uv sync --locked --all-packages
      - name: build the plaza and the river (draft lightmaps) where the cache missed
        if: steps.scene.outputs.cache-hit != 'true' || steps.road.outputs.cache-hit != 'true'
        run: |
          # 自建机器（infra/ci-runner）的镜像里已经装好，那里也没有 sudo
          if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          fi
          uv venv --python 3.13 "$RUNNER_TEMP/bpy"
          uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
          export BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python"
          if [ "${{ steps.scene.outputs.cache-hit }}" != true ]; then bash assets/pipeline/plaza/build.sh draft "$ZOUJIN_SCENE_ROOT/syracuse-square"; fi
          if [ "${{ steps.road.outputs.cache-hit }}" != true ]; then bash assets/pipeline/road/build.sh draft "$ZOUJIN_SCENE_ROOT"; fi
      # the crowd pack goes inside the plaza's build, as in a deploy (assets/pipeline/crowd/build.sh)
      - name: crowd pack from the cache
        id: crowd
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crowd
          key: crowd-${{ hashFiles('assets/pipeline/crowd/**', 'assets/pipeline/plaza/requirements.txt') }}
      - name: build the crowd pack when the cache missed
        if: steps.crowd.outputs.cache-hit != 'true'
        run: |
          if [ ! -x "$RUNNER_TEMP/bpy/bin/python" ]; then
            if [ -z "${ZOUJIN_CI_PREINSTALLED:-}" ]; then
              sudo apt-get update -q
              sudo apt-get install -y -q --no-install-recommends libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
            fi
            uv venv --python 3.13 "$RUNNER_TEMP/bpy"
            uv pip install --python "$RUNNER_TEMP/bpy/bin/python" -r assets/pipeline/plaza/requirements.txt
          fi
          BPY_PYTHON="$RUNNER_TEMP/bpy/bin/python" bash assets/pipeline/crowd/build.sh "$RUNNER_TEMP/crowd"
      - run: rm -rf "$ZOUJIN_SCENE_ROOT/syracuse-square/crowd" && cp -R "$RUNNER_TEMP/crowd" "$ZOUJIN_SCENE_ROOT/syracuse-square/crowd"
      - name: unit tests (navmesh on the built plaza, sun)
        run: pnpm --filter @zoujin/web test
      - name: build
        run: pnpm --filter @zoujin/web build
      - name: bundle budget (shell <= 120 KB, 3D chunk <= 250 KB, brotli)
        run: pnpm --filter @zoujin/web check:bundle
      - name: Chromium for Playwright
        # 系统依赖：自建机器的镜像里已经装好（没有 sudo），GitHub 自带的机器上用 --with-deps 装
        run: |
          if [ -n "${ZOUJIN_CI_PREINSTALLED:-}" ]; then deps=""; else deps="--with-deps"; fi
          pnpm --filter @zoujin/web exec playwright install $deps chromium
      - name: e2e (world screen; the river's two acts; app shell against the mock)
        run: pnpm --filter @zoujin/web e2e
      - name: screenshots for UX
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: world-screenshots
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
