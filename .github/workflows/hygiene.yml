# Runs every time: secret scanning, large files (dev-plan 2.4).
# 毎回実行：シークレットスキャン、大きなファイル（dev-plan 2.4）。
name: hygiene

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner -v .'
      # Optional: zg adds the Actions secret KNOWN_IDS in the repo settings (real project ID, project number, billing ID, etc.,
      # one per line); PRs and pushes to main check whether any leaked into the repo, catching them before they merge into main.
      # The values themselves never enter the repo, and the script does not print them.
      # The repo is private with no forks and PRs all come from project threads, so giving this secret to PR runs is low risk.
      # Skipped if not set.
      # 任意：zg がリポジトリ設定で Actions secret KNOWN_IDS を追加する（実際のプロジェクト ID、プロジェクト番号、請求先 ID など、
      # 1 行に 1 つ）。PR と main への push の両方で、リポジトリに紛れ込んでいないかを調べ、main にマージされる前に止める。
      # 値そのものはリポジトリに入れず、スクリプトも出力しない。
      # リポジトリは非公開で fork もなく、PR はすべてプロジェクトのスレッドから来るので、PR の実行にこの secret を渡すリスクは小さい。
      # 未設定ならスキップする。
      - name: Known IDs
        env:
          KNOWN_IDS: ${{ secrets.KNOWN_IDS }}
        run: python3 .github/scripts/check_known_ids.py

  large-files:
    name: no large files outside LFS
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/check_large_files.py
