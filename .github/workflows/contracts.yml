# Contract generated files match the Schema (C-1): rerun `uv run contracts-gen`; the generated files in the repo must not change.
# 契約の生成物が Schema と一致すること（C-1）：`uv run contracts-gen` を再実行し、リポジトリの生成物に差分が出てはならない。
# Generation needs both Python (datamodel-code-generator) and Node (json-schema-to-typescript), hence a separate workflow.
# 生成には Python（datamodel-code-generator）と Node（json-schema-to-typescript）の両方が必要なので、workflow を分けている。
# Schema validation, examples and contract tests are in python.yml's pytest; TypeScript type checking is in node.yml's tsc.
# Schema の検証、例、契約テストは python.yml の pytest で、TypeScript の型チェックは node.yml の tsc で行う。
name: contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "uv.lock"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - ".nvmrc"
      - ".python-version"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - "uv.lock"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - ".nvmrc"
      - ".python-version"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated types are up to date
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run contracts-gen
      - name: Generated files match the repo / 生成物がリポジトリと一致
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
