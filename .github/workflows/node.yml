# Node：eslint、prettier、tsc、预算文件（dev-plan 2.4）；场景清单对照布局和世界模型（改了 world.json 也查，F-2）。
name: node

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/contracts/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierignore"
      - ".nvmrc"
      - ".github/**"
      - "*.md"
      - "services/**/*.md"
      - "packages/**/*.md"
      - "infra/**"
      - "worlds/*/*/world.json"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/contracts/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierignore"
      - ".nvmrc"
      - ".github/**"
      - "*.md"
      - "services/**/*.md"
      - "packages/**/*.md"
      - "infra/**"
      - "worlds/*/*/world.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: eslint, prettier, tsc, budgets
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","zoujin-mac"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # F-0（首屏 JS）、F-2（场景、人物）接上真正的预算检查；现在只确认文件能读。
      - run: node -e "JSON.parse(require('fs').readFileSync('assets/budgets.json','utf8'))"
      # 进仓库的场景清单：预算、位置点和 layout.json、用到这个场景的世界模型（地点、sceneRef、出口）。不生成，几秒钟
      - run: node assets/pipeline/plaza/check_scene.mjs assets/scenes/syracuse-square
      # 归途的川（F-10）：两个包、共用包、scene.road-river 的索引和合起来的布局
      - run: |
          for p in road-river-calm road-river-flood; do node assets/pipeline/plaza/check_scene.mjs assets/scenes/$p; done
          node assets/pipeline/road/check_road.mjs assets/scenes/road-common assets/scenes/road-river-calm assets/scenes/road-river-flood assets/scenes/road-river
      # 归途其余（F-15）：峠、泉、野の道和跑段的包，它们在共用包里的部分，三处的索引和合起来的布局
      - run: bash assets/pipeline/road/check_committed.sh
      # 王城（F-14）
      - run: node assets/pipeline/plaza/check_scene.mjs assets/scenes/castle-throne
