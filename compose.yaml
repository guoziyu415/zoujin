# 本地服务。不需要任何凭证，端口只开在本机。
#
# mock（B-1）：`docker compose up mock`，然后打开 http://localhost:8787。
# mock 和 `uv run zoujin-mock` 是同一个程序：仓库只读挂进去，虚拟环境和 uv 的缓存放在命名卷里，第一次启动要从 PyPI 装依赖。
# 选项照 `uv run zoujin-mock --help` 改 command，例：慢一倍加 "--speed", "2"；前端开发服务器不走同源代理时加
# "--allow-origin", "http://localhost:5173"。
#
# 后端（B-0）：`docker compose up gateway`，连带起 db、迁移和 narrator；网关在 http://localhost:8001。
# 模型一律是假的（ZJ_MODEL=fake，改成 replay 用 fixtures/model-replays）。前端开发服务器不走同源代理时，在
# backend-env 里加 ZJ_ALLOW_ORIGINS: http://localhost:5173（逗号分隔）。邀请码：
#   docker compose run --rm migrate uv run --frozen --no-dev --package zoujin-backend zoujin-admin invite create
# 只有 db：`docker compose up db`，库 zoujin（开发）和 zoujin_test（测试，每个测试清空），见 services/backend/README.md。
# 用户名和密码都是 zoujin，只给本机的开发库用。
services:
  mock:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes:
      - .:/repo:ro
      - mock-venv:/venv
      - mock-uv-cache:/root/.cache/uv
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - zoujin-mock
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    ports:
      - "127.0.0.1:8787:8787"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: zoujin
      POSTGRES_PASSWORD: zoujin
      POSTGRES_DB: zoujin
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/10-test-db.sql
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zoujin", "-d", "zoujin"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 建表（alembic upgrade head）后退出；narrator 和 gateway 等它成功再起。也顺带装好三者共用的虚拟环境。
  migrate:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes: &backend-volumes
      - .:/repo:ro
      - backend-venv:/venv
      - backend-uv-cache:/root/.cache/uv
    environment: &backend-env
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      DATABASE_URL: postgresql://zoujin:zoujin@db:5432/zoujin
      ZJ_DEV: "1"
      ZJ_MODEL: fake
      ZJ_NARRATOR_URL: http://narrator:8002
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - alembic
      - -c
      - services/backend/alembic.ini
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy

  narrator:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes: *backend-volumes
    environment: *backend-env
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - zoujin-narrator
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes: *backend-volumes
    environment: *backend-env
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - zoujin-gateway
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      narrator:
        condition: service_started

configs:
  create-test-db:
    content: |
      CREATE DATABASE zoujin_test OWNER zoujin;

volumes:
  mock-venv:
  mock-uv-cache:
  db-data:
  backend-venv:
  backend-uv-cache:
