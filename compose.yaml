# Local services. No credentials needed; ports are bound to localhost only. / ローカルサービス。認証情報は不要で、ポートはローカルホストにのみ公開。
#
# mock (B-1): `docker compose up mock`, then open http://localhost:8787.
# モック (B-1)：`docker compose up mock` のあと http://localhost:8787 を開く。
# mock is the same program as `uv run zoujin-mock`: the repo is mounted read-only, the virtualenv and uv cache live in named volumes, and the first start installs dependencies from PyPI.
# mock は `uv run zoujin-mock` と同じプログラム。リポジトリは読み取り専用でマウントし、仮想環境と uv のキャッシュは名前付きボリュームに置く。初回起動時に PyPI から依存関係をインストールする。
# Change the command per `uv run zoujin-mock --help`; e.g. add "--speed", "2" to run twice as slow; add
# "--allow-origin", "http://localhost:5173" when the frontend dev server does not use the same-origin proxy.
# オプションは `uv run zoujin-mock --help` に従って command を変更する。例：2 倍遅くするなら "--speed", "2" を追加。フロントエンドの開発サーバーが同一オリジンプロキシを使わない場合は "--allow-origin", "http://localhost:5173" を追加。
#
# Backend (B-0): `docker compose up gateway` also starts db, migrations and narrator; the gateway is at http://localhost:8001.
# バックエンド (B-0)：`docker compose up gateway` で db、マイグレーション、narrator も起動する。ゲートウェイは http://localhost:8001。
# Models are always fake (ZJ_MODEL=fake; switch to replay to use fixtures/model-replays). When the frontend dev server does not use the same-origin proxy, add
# ZJ_ALLOW_ORIGINS: http://localhost:5173 (comma-separated) to backend-env. Invite code:
# モデルは常に偽物（ZJ_MODEL=fake。replay にすると fixtures/model-replays を使う）。フロントエンドの開発サーバーが同一オリジンプロキシを使わない場合は、backend-env に ZJ_ALLOW_ORIGINS: http://localhost:5173（カンマ区切り）を追加。招待コード：
#   docker compose run --rm migrate uv run --frozen --no-dev --package zoujin-backend zoujin-admin invite create
# db only: `docker compose up db`; databases zoujin (development) and zoujin_test (tests, cleared for every test), see services/backend/README.md.
# db のみ：`docker compose up db`。データベースは zoujin（開発用）と zoujin_test（テスト用、テストごとに初期化）。services/backend/README.md を参照。
# Username and password are both zoujin, for the local development database only.
# ユーザー名とパスワードはどちらも zoujin。ローカルの開発用データベース専用。
services:
  mock:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes:
      - .:/repo:ro
      - mock-venv:/venv
      - mock-uv-cache:/root/.cache/uv
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - zoujin-mock
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    ports:
      - "127.0.0.1:8787:8787"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: zoujin
      POSTGRES_PASSWORD: zoujin
      POSTGRES_DB: zoujin
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/10-test-db.sql
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zoujin", "-d", "zoujin"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates tables (alembic upgrade head) then exits; narrator and gateway start only after it succeeds. It also sets up the virtualenv shared by all three.
  # テーブルを作成（alembic upgrade head）して終了。narrator と gateway は成功後に起動する。3 者共用の仮想環境もここで用意する。
  migrate:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes: &backend-volumes
      - .:/repo:ro
      - backend-venv:/venv
      - backend-uv-cache:/root/.cache/uv
    environment: &backend-env
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      DATABASE_URL: postgresql://zoujin:zoujin@db:5432/zoujin
      ZJ_DEV: "1"
      ZJ_MODEL: fake
      ZJ_NARRATOR_URL: http://narrator:8002
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - alembic
      - -c
      - services/backend/alembic.ini
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy

  narrator:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes: *backend-volumes
    environment: *backend-env
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - zoujin-narrator
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    image: ghcr.io/astral-sh/uv:0.11.32-python3.13-bookworm-slim
    working_dir: /repo
    volumes: *backend-volumes
    environment: *backend-env
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - --package
      - zoujin-backend
      - zoujin-gateway
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      narrator:
        condition: service_started

configs:
  create-test-db:
    content: |
      CREATE DATABASE zoujin_test OWNER zoujin;

volumes:
  mock-venv:
  mock-uv-cache:
  db-data:
  backend-venv:
  backend-uv-cache:
